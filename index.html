          <div style={{fontSize:13,fontWeight:700,color:B.white,marginBottom:10}}>What is LSI?</div>
          <div style={{fontSize:12,color:B.gray,lineHeight:1.5,marginBottom:12}}>The Langelier Saturation Index tells you if your pool water is balanced, corrosive, or scale-forming. A balanced pool protects your plaster, equipment, and keeps your water clear.</div>
          <div style={S.infoRow}><div style={infoDotStyle('#9b59b6')} /><div style={S.infoText}><div style={S.infoLabel}>Purple — Scale Forming (≥ +0.31)</div>Too much calcium. Scale will form on surfaces and equipment.</div></div>
          <div style={S.infoRow}><div style={infoDotStyle('#5cb85c')} /><div style={S.infoText}><div style={S.infoLabel}>Green — Balanced (0.00 to +0.30)</div>Perfect! This is where you want your pool to be.</div></div>
          <div style={S.infoRow}><div style={infoDotStyle('#f0ad4e')} /><div style={S.infoText}><div style={S.infoLabel}>Yellow — Acceptable (-0.30 to -0.01)</div>Slightly off but will naturally drift toward green.</div></div>
          <div style={S.infoRow}><div style={infoDotStyle('#d9534f')} /><div style={S.infoText}><div style={S.infoLabel}>Red — Corrosive (≤ -0.31)</div>Water is aggressive and can damage your pool finish and equipment.</div></div>
        </div>}
      </div>
      {/* NOTES */}
      <div style={S.sectionCard}>
        <div style={S.sectionTitle}>Notes</div>
        <textarea style={S.textArea} placeholder="Any chemicals you added or observations..." value={chemsAdded} onChange={function(e){setChemsAdded(e.target.value);}} rows={3} />
      </div>
      {/* SAVE */}
      {saveResult === 'success' && (
        <div style={{textAlign:'center',margin:'12px auto 8px'}}>
          <div style={{color:B.flagGreen,fontSize:18,fontWeight:700}}>Readings Saved!</div>
          <div style={{fontSize:12,color:B.grayMid,marginTop:4}}>Your readings have been recorded for {job.name}</div>
          <button style={{marginTop:10,background:'transparent',border:'1px solid '+B.teal,borderRadius:20,padding:'8px 20px',color:B.teal,fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:"'Jost',sans-serif"}} onClick={function(){setSaveResult(null);}}>Record New Reading</button>
        </div>
      )}
      {saveResult !== 'success' && (
        <button style={(volume<=0||saving)?S.disabledBtn:S.calcBtn} disabled={volume<=0||saving} onClick={handleSave}>
          {saving ? 'Saving...' : volume<=0 ? 'Pool Volume Required' : 'Save My Readings'}
        </button>
      )}
      {saveResult === 'error' && <div style={{textAlign:'center',fontSize:12,color:B.flagRed,marginBottom:8}}>Save failed — check your connection and try again</div>}
      <div style={{textAlign:'center',padding:'8px 0 20px',fontSize:10,color:B.grayDim}}>My Pool Chemistry v1.0.0 — Equipment Protection Plan<br/>Southwest Pools LLC | swpoolsdfw.com</div>
    </div>
  );
}
var root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(SWPCustomerChemistryApp));
</script>
</body>
</html>
