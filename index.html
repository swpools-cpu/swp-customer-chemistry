      isCustomerSubmission: 'yes',
      filterType: filterType, updateFilterType: 'no',
      filterCleanDone: 'no', filterBackwash: 'no', deAmount: '', filterNoteBody: '', filterCleanEpoch: '',
      photoCount: photos.length
    };
    var hasPhotos = photos.length > 0;
    fetch(WEBHOOK_SAVE, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) })
    .then(function(r){
      if(r.ok){
        setSaveResult('success');
        try { localStorage.setItem('swp_cust_readings_' + job.number, JSON.stringify({current:current, chemsAdded:chemsAdded})); } catch(e) {}
        // Upload photos directly to JobNimbus via webhook
        if (hasPhotos) {
          photos.forEach(function(p) {
            fetch(WEBHOOK_PHOTO, {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({
                jnid: job.jnid,
                photoBase64: p.dataUri.split(',')[1],
                jobName: job.name
              })
            }).catch(function(err) { console.warn('Photo upload failed:', err); });
          });
        }
      } else { setSaveResult('error'); }
      setSaving(false);
    })
    .catch(function(){ setSaveResult('error'); setSaving(false); });
  }
  // ========== RENDER ==========
  // PIN ENTRY SCREEN
  if (!authed) {
    return (
      <div style={S.app}>
        <div style={S.header}><img src={LOGO_SRC} alt="Southwest Pools" style={S.logo} /><div style={S.headerTitle}>My Pool Chemistry</div></div>
        <div style={Object.assign({},S.sectionCard,{marginTop:20,textAlign:'center'})}>
          <div style={{fontSize:18,fontWeight:700,color:B.white,marginBottom:6}}>Welcome</div>
          <div style={{fontSize:13,color:B.grayMid,marginBottom:20,lineHeight:1.5}}>Enter your job number to access your pool chemistry dashboard. You can find this number on your service agreement or invoices.</div>
          <input style={S.pinInput} type="number" inputMode="numeric" placeholder="1572" value={pin}
            onChange={function(e){setPin(e.target.value);setAuthErr('');}}
            onKeyDown={function(e){if(e.key==='Enter')handlePinSubmit();}}
          />
          {authErr && <div style={{color:B.flagRed,fontSize:12,marginTop:8}}>{authErr}</div>}
          <button style={Object.assign({},S.calcBtn,{marginTop:16})} onClick={handlePinSubmit} disabled={loading}>
            {loading ? 'Looking up your pool...' : 'Access My Pool'}
          </button>
        </div>
        <div style={{textAlign:'center',padding:'20px 0',fontSize:11,color:B.grayDim}}>
          Equipment Protection Plan Members Only<br/>Southwest Pools LLC | swpoolsdfw.com
        </div>
      </div>
    );
  }
  // CHEMISTRY INTERFACE
  return (
    <div style={S.app}>
      <div style={S.header}><img src={LOGO_SRC} alt="Southwest Pools" style={S.logo} /><div style={S.headerTitle}>My Pool Chemistry</div></div>
      {/* POOL INFO CARD */}
      <div style={S.sectionCard}>
        <div style={S.sectionTitle}>Your Pool</div>
        <div style={{fontSize:16,fontWeight:700,color:B.white}}>{job.name}</div>
        {job.address && <div style={{fontSize:12,color:B.grayMid,marginTop:2}}>{job.address}</div>}
        <div style={{display:'flex',gap:8,marginTop:8,flexWrap:'wrap'}}>
          {sanitizerType && <span style={sanitizerBadgeStyle(sanitizerType)}>{sanitizerType} Pool</span>}
          {filterType && <span style={Object.assign({},S.sanitizerBadge,{background:B.navyLight,color:B.grayMid,border:'1px solid '+B.grayDim})}>{filterType} Filter</span>}
          <span style={Object.assign({},S.sanitizerBadge,{background:B.navyLight,color:B.grayMid,border:'1px solid '+B.grayDim})}>{volume.toLocaleString()} gal</span>
        </div>
        <button style={{marginTop:8,background:'transparent',border:'none',color:B.teal,fontSize:11,cursor:'pointer',fontFamily:"'Jost',sans-serif",textDecoration:'underline',padding:0}} onClick={function(){setAuthed(false);setJob(null);setPin('');setSaveResult(null);}}>Switch Pool</button>
      </div>
      {/* CHEMISTRY READINGS */}
      <div style={S.card}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
          <div>
            <div style={{fontSize:10,color:B.grayMid,fontWeight:600,marginBottom:4,textTransform:'uppercase',letterSpacing:0.5}}>Input Mode</div>
            <div style={S.toggleGroup}>
              <button style={toggleBtnStyle(mode==='dials')} onClick={function(){setMode('dials');}}>Dials</button>
              <button style={toggleBtnStyle(mode==='custom')} onClick={function(){setMode('custom');}}>Custom</button>
            </div>
          </div>
          <div>
            <div style={S.volLabel}>Pool Volume</div>
            <input style={S.volInput} value={volumeStr} onChange={handleVolumeChange} onBlur={handleVolumeBlur} type="number" />
          </div>
        </div>
        <div style={{display:'flex',marginBottom:4,alignItems:'flex-end'}}>
          <div style={Object.assign({},S.colHeader,{flex:'1 1 0'})}>Your Reading</div>
          <div style={{flex:'1 1 0'}} />
          <div style={{flex:'1 1 0',textAlign:'center'}}>
            <div style={S.colHeader}>Target</div>
          </div>
        </div>
        {PARAMS.map(function(p){
          var flag = getFlag(p.key, current[p.key], ranges); var label = getParamLabel(p); var dd = p.decimals||0;
          var desVal = desired[p.key];
          return (<div key={p.key} style={S.paramRow}>
            <ParamInput mode={mode} value={current[p.key]} step={p.step} min={p.min} max={p.max} onChange={function(v){updateCurrent(p.key,v);}} decimals={dd} />
            <div style={S.paramLabel}>{label}<FlagIndicator flag={flag} />{p.showCeiling && <div style={S.subLabel}>pH Ceiling<br/>{currentCeiling}</div>}{p.showCarbAlk && <div style={S.subLabel}>{p.subLabel}<br/>{currentLSI.carbAlk}</div>}</div>
            <ParamInput mode={mode} value={desVal} step={p.step} min={p.min} max={p.max} onChange={function(v){updateDesired(p.key,v);}} decimals={dd} />
          </div>);
        })}
        <div style={S.lsiRow}>
          <div style={{flex:'1 1 0',textAlign:'center'}}><div style={lsiPillStyle(currentMeta.bg)}>{currentLSI.lsi.toFixed(2)}</div></div>
          <div style={S.lsiLabel}>LSI</div>
          <div style={{flex:'1 1 0',textAlign:'center'}}><div style={lsiPillStyle(desiredMeta.bg)}>{desiredLSI.lsi.toFixed(2)}</div></div>
        </div>
        <div style={S.separator} />
        {EXTRA_PARAMS.map(function(p){
          var flag = getFlag(p.key, current[p.key], ranges); var dd = p.decimals||0;
          var desVal = desired[p.key];
          return (<div key={p.key} style={S.paramRow}>
            <ParamInput mode={mode} value={current[p.key]} step={p.step} min={p.min} max={p.max} onChange={function(v){updateCurrent(p.key,v);}} decimals={dd} />
            <div style={S.paramLabel}>{p.label}<FlagIndicator flag={flag} /></div>
            <ParamInput mode={mode} value={desVal} step={p.step} min={p.min} max={p.max} onChange={function(v){updateDesired(p.key,v);}} decimals={dd} />
          </div>);
        })}
      </div>
      {/* TABS — no Startup tab for customer */}
      <div style={S.tabBar}>
        <button style={tabBtnStyle(tab==='dosing')} onClick={function(){setTab('dosing');}}>Dosing</button>
        <button style={tabBtnStyle(tab==='factors')} onClick={function(){setTab('factors');}}>Factors</button>
        <button style={tabBtnStyle(tab==='info')} onClick={function(){setTab('info');}}>LSI Info</button>
        <button style={tabBtnStyle(tab==='volume')} onClick={function(){setTab('volume');}}>Volume</button>
      </div>
      <div style={S.tabContent}>
        {tab==='dosing' && <div>
          {dosing.length===0 && <div style={Object.assign({},S.doseItem,{textAlign:'center'})}><div style={Object.assign({},S.doseChem,{color:'#5cb85c'})}>Your water is balanced!</div></div>}
          {dosing.map(function(d,i){return <div key={i} style={S.doseItem}><div style={S.doseChem}>{d.chem}</div>{d.amount!=null && <div style={S.doseAmt}>{d.amount} {d.unit}</div>}<div style={S.doseReason}>{d.reason}</div></div>;})}
        </div>}
        {tab==='factors' && <div>
          <div style={{fontSize:12,color:B.grayMid,marginBottom:8}}>LSI = pH + TF + CF + AF - 12.1</div>
          <div style={{display:'flex',gap:12}}>
            <div style={{flex:1}}>
              <div style={Object.assign({},S.colHeader,{marginBottom:8})}>Current</div>
              <div style={S.factorRow}><span>pH</span><span style={S.factorVal}>{current.pH.toFixed(1)}</span></div>
              <div style={S.factorRow}><span>Temp Factor</span><span style={S.factorVal}>{currentLSI.TF.toFixed(2)}</span></div>
              <div style={S.factorRow}><span>Calcium Factor</span><span style={S.factorVal}>{currentLSI.CF.toFixed(2)}</span></div>
              <div style={S.factorRow}><span>Alk Factor</span><span style={S.factorVal}>{currentLSI.AF.toFixed(2)}</span></div>
              <div style={S.factorRow}><span>Carb Alk</span><span style={S.factorVal}>{currentLSI.carbAlk}</span></div>
              <div style={Object.assign({},S.factorRow,{borderTop:'1px solid '+B.navyLight,paddingTop:6,marginTop:4})}><span style={{fontWeight:700}}>LSI</span><span style={{fontWeight:800,color:currentMeta.color}}>{currentLSI.lsi.toFixed(2)}</span></div>
            </div>
            <div style={{width:1,background:B.navyLight}} />
            <div style={{flex:1}}>
              <div style={Object.assign({},S.colHeader,{marginBottom:8})}>Target</div>
              <div style={S.factorRow}><span>pH</span><span style={S.factorVal}>{desired.pH.toFixed(1)}</span></div>
              <div style={S.factorRow}><span>Temp Factor</span><span style={S.factorVal}>{desiredLSI.TF.toFixed(2)}</span></div>
              <div style={S.factorRow}><span>Calcium Factor</span><span style={S.factorVal}>{desiredLSI.CF.toFixed(2)}</span></div>
              <div style={S.factorRow}><span>Alk Factor</span><span style={S.factorVal}>{desiredLSI.AF.toFixed(2)}</span></div>
              <div style={S.factorRow}><span>Carb Alk</span><span style={S.factorVal}>{desiredLSI.carbAlk}</span></div>
              <div style={Object.assign({},S.factorRow,{borderTop:'1px solid '+B.navyLight,paddingTop:6,marginTop:4})}><span style={{fontWeight:700}}>LSI</span><span style={{fontWeight:800,color:desiredMeta.color}}>{desiredLSI.lsi.toFixed(2)}</span></div>
            </div>
          </div>
        </div>}
        {tab==='info' && <div>
          <div style={{fontSize:13,fontWeight:700,color:B.white,marginBottom:10}}>What is LSI?</div>
          <div style={{fontSize:12,color:B.gray,lineHeight:1.5,marginBottom:12}}>The Langelier Saturation Index tells you if your pool water is balanced, corrosive, or scale-forming. A balanced pool protects your plaster, equipment, and keeps your water clear.</div>
          <div style={S.infoRow}><div style={infoDotStyle('#9b59b6')} /><div style={S.infoText}><div style={S.infoLabel}>Purple — Scale Forming (≥ +0.31)</div>Too much calcium. Scale will form on surfaces and equipment.</div></div>
          <div style={S.infoRow}><div style={infoDotStyle('#5cb85c')} /><div style={S.infoText}><div style={S.infoLabel}>Green — Balanced (0.00 to +0.30)</div>Perfect! This is where you want your pool to be.</div></div>
          <div style={S.infoRow}><div style={infoDotStyle('#f0ad4e')} /><div style={S.infoText}><div style={S.infoLabel}>Yellow — Acceptable (-0.30 to -0.01)</div>Slightly off but will naturally drift toward green.</div></div>
          <div style={S.infoRow}><div style={infoDotStyle('#d9534f')} /><div style={S.infoText}><div style={S.infoLabel}>Red — Corrosive (≤ -0.31)</div>Water is aggressive and can damage your pool finish and equipment.</div></div>
        </div>}
        {tab==='volume' && <div>
          <div style={{fontSize:13,fontWeight:700,color:B.white,marginBottom:10}}>Pool Volume Estimator</div>
          <div style={{fontSize:11,color:B.grayMid,marginBottom:12}}>Select pool shape, then adjust values to estimate volume.</div>
          <div style={{display:'flex',gap:6,marginBottom:14}}>
            {[['circle','Circle'],['oblong','Oblong'],['rect','Rectangle']].map(function(arr){
              var k=arr[0],lbl=arr[1];
              return <button key={k} onClick={function(){setVolShape(k);}} style={{flex:1,padding:'8px 4px',borderRadius:8,border:'1px solid '+(volShape===k?B.teal:B.navyLight),background:volShape===k?B.teal:'transparent',color:volShape===k?B.white:B.grayMid,fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:"'Jost',sans-serif"}}>{lbl}</button>;
            })}
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {volShape==='circle' && <Fragment><VolField label="Radius (R)" value={volInputs.radius} onChange={function(v){updateVolInput('radius',v);}} /><VolField label="Avg Depth" value={volInputs.avgDepth} onChange={function(v){updateVolInput('avgDepth',v);}} step={0.5} /></Fragment>}
            {volShape==='oblong' && <Fragment><VolField label="Length (L)" value={volInputs.length} onChange={function(v){updateVolInput('length',v);}} /><VolField label="Large Diameter (A)" value={volInputs.diamA} onChange={function(v){updateVolInput('diamA',v);}} /><VolField label="Small Diameter (B)" value={volInputs.diamB} onChange={function(v){updateVolInput('diamB',v);}} /><VolField label="Deep Depth" value={volInputs.deepDepth} onChange={function(v){updateVolInput('deepDepth',v);}} step={0.5} /><VolField label="Shallow Depth" value={volInputs.shallowDepth} onChange={function(v){updateVolInput('shallowDepth',v);}} step={0.5} /></Fragment>}
            {volShape==='rect' && <Fragment><VolField label="Length (L)" value={volInputs.length} onChange={function(v){updateVolInput('length',v);}} /><VolField label="Width (W)" value={volInputs.width} onChange={function(v){updateVolInput('width',v);}} /><VolField label="Deep Depth" value={volInputs.deepDepth} onChange={function(v){updateVolInput('deepDepth',v);}} step={0.5} /><VolField label="Shallow Depth" value={volInputs.shallowDepth} onChange={function(v){updateVolInput('shallowDepth',v);}} step={0.5} /></Fragment>}
          </div>
          <div style={{textAlign:'center',margin:'18px 0 10px'}}><div style={{fontSize:28,fontWeight:800,color:B.teal}}>{Number(calcVol).toLocaleString()}</div><div style={{fontSize:13,color:B.grayMid}}>gallons</div></div>
          <button onClick={function(){setVolume(Math.round(calcVol));setTab('dosing');}} style={Object.assign({},S.calcBtn,{margin:'8px auto 4px',padding:'10px',fontSize:14})}>Use This Volume</button>
        </div>}
      </div>
      {/* NOTES */}
      <div style={S.sectionCard}>
        <div style={S.sectionTitle}>Notes</div>
        <textarea style={S.textArea} placeholder="Any chemicals you added or observations..." value={chemsAdded} onChange={function(e){setChemsAdded(e.target.value);}} rows={3} />
      </div>
      {/* PHOTO CAPTURE SECTION */}
      <div style={S.sectionCard}>
        <div style={S.sectionTitle}>Photos</div>
        <input ref={photoInputRef} type="file" accept="image/*" capture="environment" multiple style={{display:'none'}} onChange={handlePhotoCapture} />
        {photos.length > 0 && (
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:10}}>
            {photos.map(function(p) {
              return React.createElement('div', {key:p.id, style:{position:'relative',width:70,height:70,borderRadius:8,overflow:'hidden',border:'1px solid '+B.navyLight}},
                React.createElement('img', {src:p.dataUri, style:{width:'100%',height:'100%',objectFit:'cover'}}),
                React.createElement('button', {onClick:function(){removePhoto(p.id);}, style:{position:'absolute',top:2,right:2,width:20,height:20,borderRadius:'50%',background:'rgba(0,0,0,0.7)',border:'none',color:B.white,fontSize:12,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',padding:0,lineHeight:'20px'}}, '×')
              );
            })}
          </div>
        )}
        {photos.length < MAX_PHOTOS && (
          <button
            onClick={function(){if(photoInputRef.current)photoInputRef.current.click();}}
            disabled={photoProcessing}
            style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,width:'100%',padding:'12px',background:B.navyLight,border:'1px solid '+B.grayDim,borderRadius:10,color:B.white,fontSize:14,fontWeight:600,cursor:photoProcessing?'wait':'pointer',fontFamily:"'Jost',sans-serif"}}
          >
            {photoProcessing ? 'Processing...' : photos.length === 0 ? 'Take / Add Photos' : 'Add More Photos'}
          </button>
        )}
        <div style={{fontSize:10,color:B.grayDim,marginTop:6,textAlign:'center'}}>{photos.length}/{MAX_PHOTOS} photos</div>
      </div>
      {/* SAVE */}
      {saveResult === 'success' && (
        <div style={{textAlign:'center',margin:'12px auto 8px'}}>
          <div style={{color:B.flagGreen,fontSize:18,fontWeight:700}}>Readings Saved!</div>
          <div style={{fontSize:12,color:B.grayMid,marginTop:4}}>Your readings have been recorded for {job.name}</div>
          {photos.length > 0
            ? <div style={{fontSize:11,color:B.flagGreen,marginTop:3}}>{photos.length} photo{photos.length>1?'s':''} submitted</div>
            : null
          }
          <button style={{marginTop:10,background:'transparent',border:'1px solid '+B.teal,borderRadius:20,padding:'8px 20px',color:B.teal,fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:"'Jost',sans-serif"}} onClick={function(){setSaveResult(null);setPhotos([]);}}>Record New Reading</button>
        </div>
      )}
      {saveResult !== 'success' && (
        <button style={(volume<=0||saving||photoProcessing)?S.disabledBtn:S.calcBtn} disabled={volume<=0||saving||photoProcessing} onClick={handleSave}>
          {saving ? 'Saving...' : photoProcessing ? 'Processing photos...' : volume<=0 ? 'Pool Volume Required' : photos.length > 0 ? 'Save My Readings (' + photos.length + ' photo' + (photos.length>1?'s':'') + ')' : 'Save My Readings'}
        </button>
      )}
      {saveResult === 'error' && <div style={{textAlign:'center',fontSize:12,color:B.flagRed,marginBottom:8}}>Save failed — check your connection and try again</div>}
      <div style={{textAlign:'center',padding:'8px 0 20px',fontSize:10,color:B.grayDim}}>My Pool Chemistry v1.2.1 — Equipment Protection Plan<br/>Southwest Pools LLC | swpoolsdfw.com</div>
    </div>
  );
}
var root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(SWPCustomerChemistryApp));
</script>
</body>
</html>
