  // Photo capture helpers
  function compressPhoto(file) {
    return new Promise(function(resolve, reject) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          var w = img.width, h = img.height;
          var maxDim = 1200;
          var scale = 1;
          if (w > maxDim || h > maxDim) { scale = maxDim / Math.max(w, h); }
          var nw = Math.round(w * scale);
          var nh = Math.round(h * scale);
          var canvas = document.createElement('canvas');
          canvas.width = nw;
          canvas.height = nh;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, nw, nh);
          var dataUri = canvas.toDataURL('image/jpeg', 0.7);
          resolve({
            id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
            dataUri: dataUri,
            name: file.name || 'photo.jpg'
          });
        };
        img.onerror = function() { reject(new Error('Failed to load image')); };
        img.src = e.target.result;
      };
      reader.onerror = function() { reject(new Error('Failed to read file')); };
      reader.readAsDataURL(file);
    });
  }
  function handlePhotoCapture(e) {
    var files = e.target.files;
    if (!files || files.length === 0) return;
    var remaining = MAX_PHOTOS - photos.length;
    if (remaining <= 0) return;
    var toProcess = Array.from(files).slice(0, remaining);
    setPhotoProcessing(true);
    Promise.all(toProcess.map(compressPhoto))
      .then(function(compressed) {
        setPhotos(function(prev) { return prev.concat(compressed).slice(0, MAX_PHOTOS); });
        setPhotoProcessing(false);
      })
      .catch(function() { setPhotoProcessing(false); });
    if (photoInputRef.current) photoInputRef.current.value = '';
  }

        {tab==='dosing' && <div>
          {dosing.length===0 && (function(){var L=currentMeta.label, v=(currentLSI.lsi>=0?'+':'')+currentLSI.lsi.toFixed(2);var head = L==='BALANCED' ? 'Your water is balanced' : 'Nothing to add right now';var body = L==='BALANCED' ? 'Nothing to add right now \u2014 this is exactly where we want it.' : L==='ACCEPTABLE' ? 'Your water is slightly aggressive at '+v+'. It is not harmful and there is nothing to do today \u2014 just keep an eye on it at your next test.' : L==='CORROSIVE' ? 'Your water is corrosive at '+v+', which can etch plaster over time. Please give us a call.' : 'Your water is scale-forming at '+v+', which can leave deposits on surfaces and equipment. Please give us a call.';return <div style={Object.assign({},S.doseItem,{textAlign:'center'})}><div style={Object.assign({},S.doseChem,{color:currentMeta.color})}>{head}</div><div style={Object.assign({},S.doseReason,{marginTop:5})}>{body}</div></div>;})()}

        {tab==='factors' && <div>

              <div style={S.factorRow}><span>Temp Factor</span><span style={S.factorVal}>{desiredLSI.TF.toFixed(2)}</span></div>
              <div style={S.factorRow}><span>Calcium Factor</span><span style={S.factorVal}>{desiredLSI.CF.toFixed(2)}</span></div>
              <div style={S.factorRow}><span>Alk Factor</span><span style={S.factorVal}>{desiredLSI.AF.toFixed(2)}</span></div>

              <div style={S.factorRow}><span>Carb Alk</span><span style={S.factorVal}>{desiredLSI.carbAlk}</span></div>
              <div style={Object.assign({},S.factorRow,{borderTop:'1px solid '+B.navyLight,paddingTop:6,marginTop:4})}><span style={{fontWeight:700}}>LSI</span><span style={{fontWeight:800,color:desiredMeta.color}}>{desiredLSI.lsi.toFixed(2)}</span></div>
            </div>
          </div>
        </div>}
        {tab==='guide' && <div>
          <div style={{display:'flex',gap:6,marginBottom:14}}>
            {[['how','How-To'],['care','Orenda Care']].map(function(g){ var active=guideSec===g[0]; return <button key={g[0]} onClick={function(){setGuideSec(g[0]);}} style={{flex:1,padding:'8px 4px',borderRadius:8,border:'1px solid '+(active?B.teal:B.navyLight),background:active?B.teal:'transparent',color:active?B.white:B.grayMid,fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:"'Jost',sans-serif"}}>{g[1]}</button>; })}
          </div>
          {guideSec==='how' && <div>
            <div style={{fontSize:13,fontWeight:700,color:B.white,marginBottom:10}}>How to use My Pool</div>
            {[
              ['1','Log in with your job number','It’s on your Southwest Pools invoice or portal. Your pool size, sanitizer, and filter type load in automatically.'],
              ['2','Enter your test readings','Under “Current,” type pH, alkalinity, calcium, CYA (stabilizer), chlorine, salt/TDS, and water temp. A good test kit (like a Taylor K-2006) gives the best results.'],

              ['4','Adjust your Target if needed','Targets auto-fill to match what you entered. Change any target and the Dosing tab updates instantly.'],

              ['6','Add chemicals the right way','One at a time, pump running, poured slowly around the deep end. Let it circulate, then retest — don’t chase readings.'],

              <div style={{flexShrink:0,width:24,height:24,borderRadius:12,background:B.teal,color:B.white,fontSize:13,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center'}}>{s[0]}</div>

            </div>;})}

            </div>

          {guideSec==='care' && <div>
            <div style={{fontSize:13,fontWeight:700,color:B.white,marginBottom:4}}>Orenda Water Care</div>
            <div style={{fontSize:12,color:B.gray,lineHeight:1.5,marginBottom:12}}>Southwest Pools uses the Orenda program — a proactive approach that keeps water balanced and clear with less chlorine. Below are homeowner maintenance doses scaled to your {volume.toLocaleString()}-gallon pool.</div>

            {volShape==='rect' && <Fragment><VolField label="Length (L)" value={volInputs.length} onChange={function(v){updateVolInput('length',v);}} /><VolField label="Width (W)" value={volInputs.width} onChange={function(v){updateVolInput('width',v);}} /><VolField label="Deep Depth" value={volInputs.deepDepth} onChange={function(v){updateVolInput('deepDepth',v);}} step={0.5} /><VolField label="Shallow Depth" value={volInputs.shallowDepth} onChange={function(v){updateVolInput('shallowDepth',v);}} step={0.5} /></Fragment>}

          <button onClick={function(){setVolume(Math.round(calcVol));setTab('dosing');}} style={Object.assign({},S.calcBtn,{margin:'8px auto 4px',padding:'10px',fontSize:14})}>Use This Volume</button>
        </div>}

      {/* MESSAGE SOUTHWEST POOLS (v2.3.0) */}
      <div style={S.sectionCard}>
        {!msgOpen && msgState !== 'sent' && <div style={{textAlign:'center'}}>
          <div style={{fontSize:13,color:B.grayMid,marginBottom:8}}>Question or concern about your pool?</div>
          <button style={Object.assign({},S.calcBtn,{margin:0})} onClick={function(){ setMsgOpen(true); setMsgState(''); }}>Message Southwest Pools</button>
        </div>}
        {msgState === 'sent' && <div style={{textAlign:'center'}}>
          <div style={{color:B.flagGreen,fontSize:16,fontWeight:700}}>Message sent</div>
          <div style={{fontSize:12,color:B.grayMid,marginTop:4}}>We’ll get back to you by email or text.</div>
          <button style={{marginTop:8,background:'transparent',border:'none',color:B.teal,fontSize:12,cursor:'pointer',textDecoration:'underline',fontFamily:"'Jost',sans-serif"}} onClick={function(){ setMsgState(''); setMsgOpen(true); }}>Send another</button>
        </div>}
        {msgOpen && msgState !== 'sent' && <div>
          <div style={S.sectionTitle}>Message Southwest Pools</div>
          <textarea value={msgText} onChange={function(e){ setMsgText(e.target.value); }} rows={4} placeholder="What’s going on? Add a photo if it helps."
            style={{width:'100%',boxSizing:'border-box',background:B.navyLight,border:'1px solid '+B.teal,borderRadius:8,padding:'10px 12px',color:B.white,fontFamily:"'Jost',sans-serif",fontSize:15,outline:'none',resize:'vertical'}} />
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:8}}>
            {msgPhotos.map(function(ph){ return (<div key={ph.id} style={{position:'relative'}}>
              <img src={ph.dataUri} alt="" style={{width:64,height:64,objectFit:'cover',borderRadius:6}} />
              <button onClick={function(){ setMsgPhotos(function(prev){ return prev.filter(function(x){ return x.id !== ph.id; }); }); }} style={{position:'absolute',top:-6,right:-6,width:20,height:20,borderRadius:10,border:'none',background:B.flagRed,color:'#fff',fontSize:12,cursor:'pointer'}}>×</button>
            </div>); })}
          </div>
          <input ref={msgPhotoRef} type="file" accept="image/*" multiple style={{display:'none'}} onChange={handleMsgPhoto} />
          {msgPhotos.length < 3 && <button style={{marginTop:8,background:'transparent',border:'1px solid '+B.teal,borderRadius:20,padding:'6px 16px',color:B.teal,fontSize:12,cursor:'pointer',fontFamily:"'Jost',sans-serif"}} onClick={function(){ if (msgPhotoRef.current) msgPhotoRef.current.click(); }}>Add a photo</button>}
          {msgState === 'error' && <div style={{color:B.flagRed,fontSize:12,marginTop:8}}>Couldn’t send — check your connection and try again.</div>}
          <div style={{display:'flex',gap:8,marginTop:12}}>
            <button style={Object.assign({},S.calcBtn,{flex:1,margin:0,background:'transparent',border:'1px solid '+B.grayDim,color:B.grayMid})} onClick={function(){ setMsgOpen(false); setMsgState(''); }}>Cancel</button>
            <button style={Object.assign({},(msgText.trim() && msgState !== 'sending') ? S.calcBtn : S.disabledBtn,{flex:2,margin:0})} disabled={!msgText.trim() || msgState === 'sending'} onClick={sendMessage}>{msgState === 'sending' ? 'Sending…' : 'Send message'}</button>
          </div>
        </div>}
      </div>
      <div style={{textAlign:'center',padding:'8px 0 20px',fontSize:10,color:B.grayDim}}>My Pool Chemistry v2.3.0 — Signature Care Plan<br/>Southwest Pools LLC | swpoolsdfw.com</div>
    </div>
  );
}
var root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(SWPCustomerChemistryApp));
</script>
</body>
</html>
